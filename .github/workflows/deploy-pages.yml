name: Deploy Osu Mania to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build with Prerender
        env:
          VITE_PRERENDER: "true"
        run: npm run build

      - name: Verify build output directory
        run: |
          if [ -d ".output/public" ]; then
            echo "DEPLOY_PATH=.output/public" >> $GITHUB_ENV
          elif [ -d "dist/public" ]; then
            echo "DEPLOY_PATH=dist/public" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=dist" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
